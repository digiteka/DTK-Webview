<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            background-color: transparent;
        }

        #dtk-videofeed-carrousel {
            background-color: transparent;
        }
    </style>
</head>

<body>
    <div id="dtk-videofeed-carrousel"></div>
    <script type="text/javascript">
        window.MDTK_videofeed = "${mdtk}";
        window.MDTK_carrousel_height = "95vh";
        window.MDTK_carrousel_fromsdk = true;
        window.MDTK_videofeed_adunit_path = "${adUnitPath}";
        window.MDTK_videofeed_zone_index = "${zoneId}";
        window.MDTK_VF_BRANCH = "${vfBranch}";
        window.MDTK_CARR_BRANCH = "${carrBranch}";

        window.addEventListener('message', function (event) {
            if (
                event.data &&
                event.data.videofeed === true &&
                event.data.action === 'openFromCarrousel' &&
                window.AndroidVfBridge
            ) {
                window.AndroidVfBridge.openFromCarrousel(JSON.stringify(event.data.slideInfos || {}));
            }
        });

        const branchValue = typeof window.MDTK_VF_BRANCH === 'string' && window.MDTK_VF_BRANCH ? window.MDTK_VF_BRANCH : null;
        const videofeed_domain = !branchValue
            ? '//videofeed.digiteka.com'
            : branchValue.startsWith('192.168')
                ? `https://${branchValue}/dist`
                : `//${branchValue}.d33gpayci0qt6k.amplifyapp.com`;
        const source = videofeed_domain + '/launcher.min.js';

        const scriptElement = document.createElement('script');
        scriptElement.async = true;
        scriptElement.src = source;
        document.body.appendChild(scriptElement);
    </script>
</body>

</html>
